[workspace]
resolver = "2"
members = [
  "crates/wallet-domain",
  "crates/keystore",
  "crates/secure-storage",
  "crates/chain-core",
  "crates/wallet-orchestration",
  "crates/chain-ethereum",
  "crates/chain-bitcoin",
  "crates/chain-solana",
  "crates/chain-tron",
  "crates/rpc-client",
  "crates/ffi-bridge",
]

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
bip39 = { version = "2", features = ["rand"] }
tiny-hderive = "0.3"
secp256k1 = "0.29"
ed25519-dalek = { version = "2", features = ["zeroize"] }
k256 = "0.13"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy = { version = "1", features = ["full"] }
bdk_wallet = "1"
bdk_esplora = "0.21"
rusqlite = { version = "0.31", features = ["bundled"] }
solana-signer = "2"
solana-rpc-client = "2"
flutter_rust_bridge = "=2.0.0-dev.32"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
bech32 = "0.9"
uuid = { version = "1", features = ["v4"] }
url = "2"
pbkdf2 = "0.11"
hmac = "0.12"