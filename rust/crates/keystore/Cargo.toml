[package]
name = "keystore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Enables `Mnemonic::phrase_for_test`, which is consumed by the
# integration tests in `tests/vectors.rs`. Production builds
# (default features) do not compile this helper, so the mnemonic
# phrase is never readable outside of test contexts.
test-fixtures = []

[dependencies]
bip39 = { workspace = true }
tiny-hderive = { workspace = true }
secp256k1 = { workspace = true }
ed25519-dalek = { workspace = true }
k256 = { workspace = true }
zeroize = { workspace = true }
wallet-domain = { path = "../wallet-domain" }
hex = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
bs58 = { workspace = true }
bech32 = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
ripemd = { workspace = true }

[[test]]
name = "vectors"
# `tests/vectors.rs` references `phrase_for_test`, which is gated
# behind the `test-fixtures` feature. Run the integration suite with
# `cargo test -p keystore --features test-fixtures`.
required-features = ["test-fixtures"]
